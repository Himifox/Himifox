<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="foxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00"/>
      <stop offset="100%" style="stop-color:#FF5722"/>
    </linearGradient>
    <linearGradient id="earInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB74D"/>
      <stop offset="100%" style="stop-color:#FF9800"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF3E0"/>
      <stop offset="100%" style="stop-color:#FFE0B2"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" opacity="0.5"/>

  <!-- Left ear (outer) -->
  <polygon points="120,80 60,30 80,140" fill="url(#foxGrad)" stroke="none"/>
  <!-- Left ear (inner) -->
  <polygon points="112,82 72,45 88,126" fill="url(#earInner)" opacity="0.6"/>

  <!-- Right ear (outer) -->
  <polygon points="280,80 340,30 320,140" fill="url(#foxGrad)" stroke="none"/>
  <!-- Right ear (inner) -->
  <polygon points="288,82 328,45 312,126" fill="url(#earInner)" opacity="0.6"/>

  <!-- Face -->
  <ellipse cx="200" cy="230" rx="130" ry="120" fill="url(#foxGrad)"/>

  <!-- Left cheek white -->
  <path d="M 130 250 Q 100 280 120 320 Q 150 350 200 350 L 200 220 Q 150 220 130 250 Z" fill="#FFF" opacity="0.9"/>
  <!-- Right cheek white -->
  <path d="M 270 250 Q 300 280 280 320 Q 250 350 200 350 L 200 220 Q 250 220 270 250 Z" fill="#FFF" opacity="0.9"/>

  <!-- Forehead bridge -->
  <path d="M 160 150 Q 200 130 240 150 L 200 230 Z" fill="#FFB74D" opacity="0.5"/>

  <!-- Left eye -->
  <ellipse cx="155" cy="225" rx="16" ry="18" fill="#fff"/>
  <ellipse cx="157" cy="225" rx="10" ry="12" fill="#2D2D2D"/>
  <ellipse cx="160" cy="220" rx="4" ry="5" fill="#fff"/>

  <!-- Right eye -->
  <ellipse cx="245" cy="225" rx="16" ry="18" fill="#fff"/>
  <ellipse cx="243" cy="225" rx="10" ry="12" fill="#2D2D2D"/>
  <ellipse cx="246" cy="220" rx="4" ry="5" fill="#fff"/>

  <!-- Nose -->
  <ellipse cx="200" cy="268" rx="10" ry="7" fill="#2D2D2D"/>

  <!-- Mouth -->
  <path d="M 200 275 Q 185 290 175 285" fill="none" stroke="#2D2D2D" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 200 275 Q 215 290 225 285" fill="none" stroke="#2D2D2D" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Whiskers left -->
  <line x1="100" y1="255" x2="145" y2="260" stroke="#2D2D2D" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="95" y1="268" x2="145" y2="268" stroke="#2D2D2D" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="100" y1="280" x2="145" y2="275" stroke="#2D2D2D" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Whiskers right -->
  <line x1="300" y1="255" x2="255" y2="260" stroke="#2D2D2D" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="305" y1="268" x2="255" y2="268" stroke="#2D2D2D" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="300" y1="280" x2="255" y2="275" stroke="#2D2D2D" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
